
# Terraform Provider testing workflow.
name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  id-token: write

TEST?=$$(go list ./... | grep -v 'vendor' | grep -v 'examples')

testacc:
	TF_ACC=1 go test $(TEST) -v $(TESTARGS) -timeout $(TESTTIMEOUT)

      - run: make testacc
        timeout-minutes: 10


